services:
  api:
    build:
      context: ./src
      dockerfile: NoobGg.Api/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - upload_data:/app/wwwroot/uploads
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - MongoDb__ConnectionString=mongodb://mongo:27017
      - MongoDb__DatabaseName=noobgg_demo_200
      - Redis__ConnectionString=redis:6379
      - DemoSeed__Enabled=true
      - DemoSeed__Scenario=coherent-200
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongo:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  upload_data:
  mongo_data:
  redis_data:
